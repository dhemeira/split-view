[package]
name = "split-view"
version = "0.1.1"
description = "A minimal responsive preview tool"
authors = ["SplitView contributors"]
edition = "2021"

[lib]
name = "split_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
